server {
    listen 80;
    server_name 172.22.2.24;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 172.22.2.24;
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # === 基础优化 ===
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    client_max_body_size 50m;

    # === 前端管理平台 ===
    location /clmisweb/ {
        alias /opt/cfpc/dist/;
        index index.html;
        try_files $uri $uri/ /clmisweb/index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            alias /opt/cfpc/dist/;
            expires 7d;
            access_log off;
        }
    }

    # === 前端业务平台 ===
    location /clmap/ {
        alias /opt/clmap/dist/;
        index index.html;
        try_files $uri $uri/ /clmap/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            alias /opt/clmap/dist/;
            expires 7d;
            access_log off;
        }
    }

    # === 危房监测 ===
    location /wfjc/ {
        alias /opt/weifang/dist/;
        index index.html;
        try_files $uri $uri/ /wfjc/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            alias /opt/weifang/dist/;
            expires 7d;
            access_log off;
        }
    }

    # === 后端 API ===
    location /clapi/ {
        proxy_pass http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # === 3D 模型文件 ===
    location /CSSMX/model/ {
        alias /opt/tiles/CSSMX/model/;
        autoindex on;
        expires 30d;
        access_log off;
    }

    # === 安全 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
