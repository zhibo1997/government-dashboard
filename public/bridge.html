<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桥梁监控设备 - 简化标签 + 点击弹窗</title>
  <script src="./Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="./Cesium/Widgets/widgets.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #cesiumContainer { width: 100%; height: 100%; }
    .cesium-viewer-bottom { display: none !important; }

    /* 工具栏 */
    #toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      background: rgba(10, 20, 30, 0.9);
      border: 1px solid #2a4a6a;
      border-radius: 6px;
      padding: 10px;
      color: #ccc; font-size: 13px;
    }
    #toolbar h3 { color: #4a9eff; margin-bottom: 8px; font-size: 14px; }
    #toolbar .bridge-btn {
      display: block; width: 100%;
      padding: 8px 12px; margin-bottom: 4px;
      background: rgba(74, 158, 255, 0.15);
      border: 1px solid #2a4a6a;
      border-radius: 4px;
      color: #8ab; cursor: pointer;
      font-size: 12px; text-align: left;
      transition: all 0.2s;
    }
    #toolbar .bridge-btn:hover { background: rgba(74, 158, 255, 0.3); color: #fff; }
    #toolbar .bridge-btn.active { background: rgba(74, 158, 255, 0.4); color: #fff; border-color: #4a9eff; }
    #toolbar label { display: block; margin-top: 8px; cursor: pointer; font-size: 12px; }
    #toolbar input[type="checkbox"] { margin-right: 6px; }

    /* 加载状态 */
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 100; background: rgba(0,0,0,0.8); color: #4a9eff;
      padding: 20px 30px; border-radius: 8px; font-size: 16px;
    }
    #loading.done { display: none; }

    /* 日志 */
    #log {
      position: absolute; bottom: 10px; left: 10px; z-index: 20;
      background: rgba(0,0,0,0.7); color: #0f0; padding: 8px 12px;
      border-radius: 4px; font-size: 11px; max-width: 500px;
      max-height: 200px; overflow-y: auto; font-family: monospace;
    }

    /* 设备点位 */
    .device-dot {
      position: absolute;
      width: 32px;
      height: 32px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 15;
      will-change: transform;
      transform: translate(-50%, -100%);
    }
    .device-dot img {
      width: 100%;
      height: 100%;
      opacity: 0.6;
      filter: drop-shadow(0 0 3px rgba(0, 255, 136, 0.3));
    }
    .device-dot:hover {
      transform: translate(-50%, -100%) scale(1.2);
    }
    .device-dot:hover img {
      opacity: 0.8;
      filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.6));
    }
    .device-dot.selected img {
      opacity: 0.9;
      filter: drop-shadow(0 0 6px rgba(255, 102, 0, 0.6));
    }
    .device-dot.hidden {
      visibility: hidden;
    }

    /* 点位容器 */
    #dotContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    /* 设备详情弹窗 */
    #devicePopup {
      display: none;
      position: absolute;
      z-index: 30;
      background: rgba(6, 20, 40, 0.95);
      border: 1px solid rgba(74, 158, 255, 0.8);
      border-radius: 6px;
      padding: 16px 20px;
      color: #e0f0ff;
      font-size: 13px;
      min-width: 250px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      pointer-events: auto;
    }
    #devicePopup::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid rgba(74, 158, 255, 0.8);
    }
    #devicePopup .popup-title {
      font-size: 15px;
      font-weight: bold;
      color: #4a9eff;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(74, 158, 255, 0.3);
    }
    #devicePopup .popup-row {
      margin-bottom: 8px;
      display: flex;
    }
    #devicePopup .popup-label {
      color: #8ab;
      width: 70px;
      flex-shrink: 0;
    }
    #devicePopup .popup-value {
      color: #fff;
    }
    #devicePopup .popup-close {
      position: absolute;
      top: 8px;
      right: 10px;
      cursor: pointer;
      color: #8ab;
      font-size: 18px;
      line-height: 1;
    }
    #devicePopup .popup-close:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="dotContainer"></div>
  <div id="loading">加载模型中...</div>
  <div id="toolbar">
    <h3>🌉 桥梁监控</h3>
    <div id="bridgeButtons"></div>
    <label><input type="checkbox" id="chkPopups" checked> 显示设备标签</label>
    <label><input type="checkbox" id="chkEquip" checked> 显示设备模型</label>
  </div>
  <div id="log"></div>
  <div id="devicePopup">
    <span class="popup-close" onclick="closePopup()">&times;</span>
    <div class="popup-title" id="popupTitle">设备名称</div>
    <div class="popup-row">
      <span class="popup-label">设备编号</span>
      <span class="popup-value" id="popupSbbh">-</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">所属桥梁</span>
      <span class="popup-value" id="popupBridge">-</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">经度</span>
      <span class="popup-value" id="popupLng">-</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">纬度</span>
      <span class="popup-value" id="popupLat">-</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">高度</span>
      <span class="popup-value" id="popupHeight">-</span>
    </div>
  </div>

  <script>
    // ===== 日志 =====
    var logEl = document.getElementById('log');
    function log(msg) {
      console.log(msg);
      logEl.innerHTML += msg + '<br>';
      logEl.scrollTop = logEl.scrollHeight;
    }

    window.onload = function() {

    // ===== Cesium 初始化 =====
    var viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false,
      infoBox: false,
      selectionIndicator: false,
      navigationHelpButton: false,
      sceneModePicker: false,
      homeButton: false,
      fullscreenButton: false,
      imageryProvider: new Cesium.UrlTemplateImageryProvider({
        url: 'https://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILECOL={x}&TILEROW={y}&TILEMATRIX={z}&tk=ce66c526b6d257e290069df275296cc7',
        subdomains: ['0','1','2','3','4','5','6','7'],
        maximumLevel: 18,
      }),
    });
    window.viewer = viewer;

    // 光照
    viewer.shadows = true;
    viewer.scene.sun.show = true;
    viewer.scene.sun.glowFactor = 0.0;
    viewer.scene.globe.enableLighting = true;
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#8899aa');
    viewer.shadowMap.size = 2048;
    viewer.shadowMap.softShadows = true;
    viewer.shadowMap.darkness = 0.6;
    viewer.clock.currentTime = Cesium.JulianDate.fromDate(new Date());
    viewer.clock.shouldAnimate = true;
    viewer.scene.globe.depthTestAgainstTerrain = true;

    // ===== 桥梁定义 =====
    var bridges = [
      {
        qlbh: 'LHQ', name: '莲花湖大桥',
        url: 'https://webres.cityfun.com.cn/CSSMX/model/LHQ/tileset.json',
        equipUrl: 'https://webres.cityfun.com.cn/CSSMX/model/LHQ_SB/tileset.json',
        monitorUrl: 'https://webres.cityfun.com.cn/CSSMX/model/LHQ_JKSB/tileset.json',
      },
      {
        qlbh: 'MYWDQ', name: '明月湾大桥',
        url: 'https://webres.cityfun.com.cn/CSSMX/model/MYWDQ/tileset.json',
        equipUrl: 'https://webres.cityfun.com.cn/CSSMX/model/MYWDQ_SB/tileset.json',
        monitorUrl: 'https://webres.cityfun.com.cn/CSSMX/model/MYWDQ_JKSB/tileset.json',
      },
      {
        qlbh: 'DSHDQ', name: '独山湖大桥',
        url: 'https://webres.cityfun.com.cn/CSSMX/model/DSHDQ/tileset.json',
        equipUrl: 'https://webres.cityfun.com.cn/CSSMX/model/DSHDQ_SB/tileset.json',
        monitorUrl: 'https://webres.cityfun.com.cn/CSSMX/model/DSHDQ_JKJJZ/tileset.json',
      },
    ];

    var bridgeTilesets = {};
    var equipTilesets = {};
    var monitorTilesets = {};
    var deviceData = {};
    var dotElements = {};        // { qlbh: [HTMLElement, ...] }
    var activeBridge = 'LHQ';
    var showPopups = true;
    var showEquip = true;
    var allDevices = [];         // [{ qlbh, device, bridgeName, dotEl }]
    var selectedDot = null;      // 当前选中的点
    var selectedTileset = null;
    var dotContainer = document.getElementById('dotContainer');

    // ===== 创建设备标识 HTML DOM =====
    async function createDevicePoints(bridgeQlbh, bridgeName, devices, type) {
      var dots = [];
      var icon = type === 'monitor'
        ? 'images/equipmentIcons/jcsblx0405.svg'  // 监控设备
        : 'images/equipmentIcons/jcsblx0406.svg'; // 监测设备

      for (var i = 0; i < devices.length; i++) {
        var device = devices[i];

        // 创建 DOM 元素
        var dot = document.createElement('div');
        dot.className = 'device-dot';
        dot.dataset.qlbh = bridgeQlbh;
        dot.dataset.type = type;

        // 添加图片
        var img = document.createElement('img');
        img.src = icon;
        img.alt = device.sbbh;
        dot.appendChild(img);

        dotContainer.appendChild(dot);

        dots.push(dot);
        allDevices.push({
          qlbh: bridgeQlbh,
          device: device,
          bridgeName: bridgeName,
          dotEl: dot,
          type: type,
        });
      }

      dotElements[bridgeQlbh + '_' + type] = dots;
      log('📍 ' + bridgeName + ' ' + (type === 'monitor' ? '监控' : '监测') + ': ' + devices.length + ' 个设备标识');
    }

    // ===== postRender 更新点位位置 =====
    viewer.scene.postRender.addEventListener(function() {
      var canvas = viewer.scene.canvas;
      var width = canvas.clientWidth;
      var height = canvas.clientHeight;

      for (var i = 0; i < allDevices.length; i++) {
        var item = allDevices[i];
        var dot = item.dotEl;
        var isActive = (item.qlbh === activeBridge);

        if (!showPopups || !isActive) {
          dot.classList.add('hidden');
          continue;
        }

        var screenPos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(
          viewer.scene,
          item.device.position
        );

        if (!screenPos || screenPos.x < -20 || screenPos.x > width + 20 ||
            screenPos.y < -20 || screenPos.y > height + 20) {
          dot.classList.add('hidden');
          continue;
        }

        dot.classList.remove('hidden');
        dot.style.transform = 'translate(' + (screenPos.x - 6) + 'px, ' + (screenPos.y - 6) + 'px)';
      }
    });

    // ===== 加载 3D Tiles =====
    async function loadTileset(url, name) {
      try {
        var ts = new Cesium.Cesium3DTileset({ url: url, shadows: Cesium.ShadowMode.ENABLED });
        await ts.readyPromise;
        viewer.scene.primitives.add(ts);
        log('✅ ' + name);
        return ts;
      } catch (err) {
        log('❌ ' + name + ': ' + err.message);
        return null;
      }
    }

    // ===== 加载 scenetree =====
    async function loadScenetree(bridge, url) {
      var treeUrl = url.replace('tileset.json', 'scenetree.json');
      try {
        var res = await fetch(treeUrl);
        if (!res.ok) return [];
        var data = await res.json();
        var scene = data.scenes && data.scenes[0];
        if (!scene || !scene.children) return [];
        var devices = [];
        for (var i = 0; i < scene.children.length; i++) {
          var el = scene.children[i];
          if (el.type !== 'element' || !el.sphere || el.sphere.length < 3) continue;
          var pos = new Cesium.Cartesian3(el.sphere[0], el.sphere[1], el.sphere[2]);
          var carto = Cesium.Cartographic.fromCartesian(pos);
          devices.push({
            sbbh: el.name,
            position: pos,
            lng: Cesium.Math.toDegrees(carto.longitude),
            lat: Cesium.Math.toDegrees(carto.latitude),
            height: carto.height,
          });
        }
        return devices;
      } catch (e) {
        return [];
      }
    }

    // ===== 显示/隐藏标签 =====
    function updatePointVisibility() {
      // postRender 会自动处理显示/隐藏
      // 这里可以添加额外的控制逻辑
    }

    // ===== 点击设备显示弹窗 + 高亮 =====
    var popupEl = document.getElementById('devicePopup');

    function highlightDot(dot) {
      // 取消之前的高亮
      if (selectedDot) {
        selectedDot.classList.remove('selected');
      }
      // 设置新的高亮
      dot.classList.add('selected');
      selectedDot = dot;
    }

    function resetHighlight() {
      if (selectedDot) {
        selectedDot.classList.remove('selected');
        selectedDot = null;
      }
      if (selectedTileset) {
        selectedTileset.style = new Cesium.Cesium3DTileStyle({
          color: "color('white', 1.0)"
        });
        selectedTileset = null;
      }
    }

    // 高亮 3D Tiles 单个要素
    function highlightTilesetFeature(tileset, featureName) {
      // 取消之前的高亮
      if (selectedTileset) {
        selectedTileset.style = new Cesium.Cesium3DTileStyle({
          color: "color('white', 1.0)"
        });
      }
      // 通过条件表达式高亮指定名称的要素
      tileset.style = new Cesium.Cesium3DTileStyle({
        color: {
          conditions: [
            ["${name} === '" + featureName + "'", "color('orange', 1.0)"],
            ["true", "color('white', 1.0)"]
          ]
        }
      });
      selectedTileset = tileset;
    }

    function showPopup(device, bridgeName, screenPos) {
      document.getElementById('popupTitle').textContent = device.sbbh;
      document.getElementById('popupSbbh').textContent = device.sbbh;
      document.getElementById('popupBridge').textContent = bridgeName;
      document.getElementById('popupLng').textContent = device.lng.toFixed(6);
      document.getElementById('popupLat').textContent = device.lat.toFixed(6);
      document.getElementById('popupHeight').textContent = device.height.toFixed(2) + ' m';

      popupEl.style.display = 'block';
      popupEl.style.left = (screenPos.x - 125) + 'px';
      popupEl.style.top = (screenPos.y - 280) + 'px';
    }

    function closePopup() {
      popupEl.style.display = 'none';
      resetHighlight();
    }
    window.closePopup = closePopup;


    // 点击 DOM 点位
    dotContainer.addEventListener('click', function(e) {
      var dot = e.target.closest('.device-dot');
      if (!dot) return;

      var qlbh = dot.dataset.qlbh;
      var index = parseInt(dot.dataset.index);

      // 找到对应的设备数据
      var deviceInfo = null;
      for (var i = 0; i < allDevices.length; i++) {
        if (allDevices[i].qlbh === qlbh && allDevices[i].dotEl === dot) {
          deviceInfo = allDevices[i];
          break;
        }
      }

      if (deviceInfo) {
        highlightDot(dot);
        // 获取屏幕位置
        var rect = dot.getBoundingClientRect();
        showPopup(deviceInfo.device, deviceInfo.bridgeName, { x: rect.left + 6, y: rect.top });
      }
    });

    // 点击 3D Tiles 监控设备模型
    var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function(click) {
      var picked = viewer.scene.pick(click.position);
      var cartesian = viewer.scene.pickPosition(click.position);

      if (cartesian) {
        var featureName = null;
        var tileset = null;

        if (Cesium.defined(picked) && picked instanceof Cesium.Cesium3DTileFeature) {
          featureName = picked.getProperty('name');
          tileset = picked.tileset;
        } else if (Cesium.defined(picked) && picked.primitive instanceof Cesium.Cesium3DTileset) {
          tileset = picked.primitive;
        }

        if (tileset && featureName) {
          var isMonitorTileset = false;
          for (var qlbh in monitorTilesets) {
            if (monitorTilesets[qlbh] === tileset) {
              isMonitorTileset = true;
              break;
            }
          }
          if (isMonitorTileset) {
            highlightTilesetFeature(tileset, featureName);
            // 匹配最近的点位
            var nearest = findNearestDevice(cartesian, 50);
            if (nearest) {
              highlightDot(nearest.dotEl);
              showPopup(nearest.device, nearest.bridgeName, click.position);
              return;
            }
          }
        }
      }

      // 点击空白处
      closePopup();
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    // 根据坐标查找最近的点位
    function findNearestDevice(position, maxDistance) {
      var minDist = maxDistance || 50;
      var nearest = null;
      for (var i = 0; i < allDevices.length; i++) {
        var item = allDevices[i];
        if (item.qlbh !== activeBridge) continue;
        var dist = Cesium.Cartesian3.distance(position, item.device.position);
        if (dist < minDist) {
          minDist = dist;
          nearest = item;
        }
      }
      return nearest;
    }

    // ===== 工具栏 =====
    function renderToolbar() {
      var html = '';
      for (var i = 0; i < bridges.length; i++) {
        var b = bridges[i];
        var cls = b.qlbh === activeBridge ? 'bridge-btn active' : 'bridge-btn';
        html += '<button class="' + cls + '" onclick="switchBridge(\'' + b.qlbh + '\')">' + b.name + '</button>';
      }
      document.getElementById('bridgeButtons').innerHTML = html;
    }

    function switchBridge(qlbh) {
      activeBridge = qlbh;
      renderToolbar();
      updatePointVisibility();
      closePopup();
      var ts = bridgeTilesets[qlbh];
      if (ts) {
        viewer.zoomTo(ts, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-45), 800));
      }
    }
    window.switchBridge = switchBridge;

    function togglePopups() {
      showPopups = document.getElementById('chkPopups').checked;
      updatePointVisibility();
      if (!showPopups) closePopup();
    }

    function toggleEquip() {
      showEquip = document.getElementById('chkEquip').checked;
      for (var k in equipTilesets) {
        if (equipTilesets[k]) equipTilesets[k].show = showEquip;
      }
      for (var k in monitorTilesets) {
        if (monitorTilesets[k]) monitorTilesets[k].show = showEquip;
      }
    }

    document.getElementById('chkPopups').addEventListener('change', togglePopups);
    document.getElementById('chkEquip').addEventListener('change', toggleEquip);

    // ===== 主流程 =====
    (async function () {
      var loadingEl = document.getElementById('loading');

      for (var i = 0; i < bridges.length; i++) {
        var b = bridges[i];

        bridgeTilesets[b.qlbh] = await loadTileset(b.url, b.name);
        if (bridgeTilesets[b.qlbh]) {
          bridgeTilesets[b.qlbh].style = new Cesium.Cesium3DTileStyle({ color: "color('white', 1.0)" });
        }

        // 加载监测设备模型 + scenetree
        equipTilesets[b.qlbh] = await loadTileset(b.equipUrl, b.name + ' 监测设备');
        var equipDevices = await loadScenetree(b, b.equipUrl);
        deviceData[b.qlbh + '_equip'] = equipDevices;
        log('📌 ' + b.name + ' 监测: ' + equipDevices.length + ' 个设备');
        if (equipDevices.length > 0) {
          await createDevicePoints(b.qlbh, b.name, equipDevices, 'equip');
        }

        // 加载监控设备模型 + scenetree（如果有）
        if (b.monitorUrl) {
          monitorTilesets[b.qlbh] = await loadTileset(b.monitorUrl, b.name + ' 监控设备');
          var monitorDevices = await loadScenetree(b, b.monitorUrl);
          deviceData[b.qlbh + '_monitor'] = monitorDevices;
          log('📌 ' + b.name + ' 监控: ' + monitorDevices.length + ' 个设备');
          if (monitorDevices.length > 0) {
            await createDevicePoints(b.qlbh, b.name, monitorDevices, 'monitor');
          }
        } else {
          deviceData[b.qlbh + '_monitor'] = [];
          log('📌 ' + b.name + ': 无监控设备');
        }
      }

      renderToolbar();
      updatePointVisibility();

      var defaultTs = bridgeTilesets['LHQ'];
      if (defaultTs) {
        viewer.zoomTo(defaultTs, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-45), 800));
      }

      loadingEl.classList.add('done');
      log('🎉 加载完成，点击设备查看弹窗');
    })();

    }; // window.onload
  </script>
</body>
</html>
